plugins {
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation libs.fabric.loader
    implementation libs.fabric.api

    implementation libs.izzel.tools
    implementation libs.arclight.api
    //implementation libs.mixin.tools
    //annotationProcessor(libs.mixin.tools) { transitive = false }

    implementation(libs.bundles.spigot.shade) { transitive = false }
    shadowCommon(libs.bundles.spigot.shade) { transitive = false }
    implementation rootProject.ext.generatedSpigot
    shadowCommon rootProject.ext.generatedSpigot

    implementation libs.fabric.permissions.api
    //include libs.fabric.permissions.api

    // XXX: for compiling (arclight-api): FabricArclightServer#registerForgeEvent
    compileOnly("net.minecraftforge:eventbus:4.0.0") { transitive = false }

    implementation(project(':i18n-config')) { transitive = false }

    common(project(path: ':arclight-common')) { transitive = false }
    shadowCommon(project(path: ':arclight-common', configuration: 'transformProductionFabric')) { transitive = false }
    common(project(':bootstrap')) { transitive = false }
    shadowCommon(project(':bootstrap')) { transitive = false }
}

processResources {
    def ver = "${project.version}+$gitHash"
    inputs.property 'version', ver

    filesMatching('fabric.mod.json') {
        expand 'version': ver
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    exclude "architectury.common.json"

    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    zip64 = true
    from rootProject.file("LICENSE")
}

assemble.dependsOn shadowJar

tasks.register('srgJar', Jar) {
    from(tasks.jar.outputs.files.collect { it.isDirectory() ? it : zipTree(it) }) {
        include 'io/izzel/**'
        exclude 'io/izzel/arclight/common/mixin/**'
    }
    archiveClassifier.set('srg')
    dependsOn jar
}

sourcesJar {
    def commonSources = rootProject.ext.commonProject.sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
