# This workflow builds the Arclight project with Gradle on GitHub Actions.
# The upstream upload step (uploadFiles) is intentionally removed because it
# requires a private ARCLIGHT_FILES_TOKEN secret. Built jars are published as
# a workflow artifact instead.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew cleanBuild build collect --no-daemon --stacktrace
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arclight-26.2-jars
          path: build/libs/*.jar
          if-no-files-found: warn
